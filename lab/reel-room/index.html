<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Room (demo) | Hadi Abid</title>
<meta name="description" content="Interactive demo of Reel Room, my shot review tool: shots, versions, notes with draw-overs, camera compare and per-department approvals.">
<link rel="stylesheet" href="reelroom.css">
</head>
<body>
<div class="demo-note" role="note">Public demo: a snapshot of <b>Halden 418</b>, a fictional reel project. Notes, approvals and drawings work, but only in this tab: nothing is saved or sent. Video is silent.</div>
<header class="slate">
  <div class="wrap">
    <a class="brand" href="../../lab.html" title="Back to Lab" style="color:inherit;text-decoration:none">← Reel Room</a>
    <div class="proj">
      <label for="project" class="muted" hidden>Project</label>
      <select id="project" aria-label="Project"><option>Loading…</option></select>
    </div>
    <span class="meta mono" id="projmeta"></span>
    <button class="btn" id="newproj" hidden>+ New project</button>
    <nav class="tabs" aria-label="Views">
      <button class="tab" id="tab-grid" aria-pressed="true">Shots</button>
      <button class="tab" id="tab-assets" aria-pressed="false">Assets<span class="count" id="assetcount"></span></button>
      <button class="tab" id="tab-script" aria-pressed="false" hidden>Script</button>
      <button class="tab" id="tab-genready" aria-pressed="false" hidden>Gen ready</button>
      <button class="tab" id="tab-notes" aria-pressed="false">Open notes<span class="count" id="opencount"></span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="empty"><strong>Loading shots</strong><span>Shots, versions and notes come from the shared database.</span></div>
</main>
<div class="toast" id="toast" hidden></div>
<script src="demo-runtime.js"></script>
<script src="reelroom.js"></script>
</body>
</html>
